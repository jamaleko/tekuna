<!DOCTYPE html>
<html>
    {{ template "head" . }}
    {{ template "navbar" . }}

    <div class="max-w-3xl mx-auto px-4">

        <div class="bg-white shadow-sm p-5 text-center">
            <h1 class="text-xl font-semibold text-gray-800">
                {{.Message}}
            </h1>
        </div>

        <!-- 🔥 BERITA LAINNYA -->
        <div class="mt-10">
            <div class="flex items-center my-10">
                <div class="flex-grow border-t"></div>
                <span class="mx-4 text-sm text-gray-400">Berita Lainnya</span>
                <div class="flex-grow border-t"></div>
            </div>

            <div class="space-y-4">
                {{range .latest}}
                <a href="/berita/{{.Slug}}" 
                   class="flex gap-4 group p-3 rounded-lg hover:bg-gray-50 transition">

                    <img src="{{.Gambar}}" 
                         class="w-24 h-20 object-cover rounded-md">

                    <div>
                        <h3 class="text-base font-semibold text-gray-900">
                            {{.Judul}}
                        </h3>
                        <p class="text-sm text-gray-500">
                            {{excerpt .Isi}}
                        </p>
                    </div>

                </a>
                {{end}}
            </div>
        </div>

    </div>

    {{ template "footer" . }}
