<!DOCTYPE html>
<html>
    {{ template "head" . }}
    {{ template "navbar" . }}

    <!-- Wrapper -->
    <div class="max-w-3xl mx-auto px-4">

        <!-- Article container (NO rounded biar nyambung navbar) -->
        <div class="bg-white shadow-sm p-5">

            <!-- Judul -->
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 leading-tight">
                {{.data.Judul}}
            </h1>
            <div class="flex items-center gap-3 mt-4 mb-4">

                <!-- Tulisan -->
                <span class="text-sm text-gray-500 font-semibold">
                    Bagikan:
                </span>

                <!-- WhatsApp -->
                <a 
                    href="https://api.whatsapp.com/send?text={{.data.Judul}} - {{printf `%s/berita/%s` `https://tekuna.my.id` .data.Slug}}"
                    target="_blank"
                    class="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-full text-sm"
                >
                    WhatsApp
                </a>

                <!-- Facebook -->
                <a 
                    href="https://www.facebook.com/sharer/sharer.php?u={{printf `%s/berita/%s` `https://tekuna.my.id` .data.Slug}}"
                    target="_blank"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-full text-sm"
                >
                    Facebook
                </a>

                <!-- X -->
                <a 
                    href="https://twitter.com/intent/tweet?text={{.data.Judul}}&url={{printf `%s/berita/%s` `https://tekuna.my.id` .data.Slug}}"
                    target="_blank"
                    class="bg-black hover:bg-gray-800 text-white px-3 py-1.5 rounded-full text-sm"
                >
                    X
                </a>

            </div>
            <!-- Gambar -->
            <img 
                src="{{.data.Gambar}}" 
                alt="{{.data.Judul}}"
                class="w-full mt-4 mb-4 object-cover"
            />

            <!-- Isi Artikel -->
            <div class="prose max-w-none text-gray-800">
                {{insertBacaJuga .data.Isi .baca}}
            </div>
            <!-- BERITA TERBARU -->
            <div class="mt-10">
                <div class="flex items-center my-10">
                    <div class="flex-grow border-t"></div>
                    <span class="mx-4 text-sm text-gray-400">Berita Lainnya</span>
                    <div class="flex-grow border-t"></div>
                </div>
                <!--<h2 class="text-xl font-bold mb-5 border-b pb-2 flex items-center gap-2">

                    <svg xmlns="http://www.w3.org/2000/svg" 
                         fill="none" 
                         viewBox="0 0 24 24" 
                         stroke-width="2" 
                         stroke="currentColor" 
                         class="w-5 h-5 text-orange-500">
                        <path stroke-linecap="round" stroke-linejoin="round" 
                              d="M12 3c1.5 3 4 4.5 4 8a4 4 0 11-8 0c0-2.5 2.5-5 4-8z" />
                    </svg>

                    Berita Terbaru
                </h2>-->

                <div class="space-y-4">

                    {{range .latest}}
                    <a href="/berita/{{.Slug}}" 
                       class="flex gap-4 group p-3 rounded-lg hover:bg-gray-50 transition">

                        <!-- Gambar -->
                        <img src="{{.Gambar}}" 
                             class="w-24 h-20 md:w-28 md:h-20 object-cover rounded-md flex-shrink-0">

                        <!-- Konten -->
                        <div class="flex flex-col justify-between">

                            <!-- Judul -->
                            <h3 class="text-base font-semibold text-gray-900 leading-snug 
                                       overflow-hidden"
                                style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">
                                {{.Judul}}
                            </h3>

                            <!-- Excerpt -->
                            <p class="text-sm text-gray-500 mt-1 line-clamp-2">
                                {{excerpt .Isi}}
                            </p>

                        </div>

                    </a>
                    {{end}}

                </div>
            </div>

        </div>
    </div>

    {{ template "footer" . }}
