<!DOCTYPE html>
<html>
    {{ template "head" . }}
    {{ template "navbar" . }}

    <div class="max-w-3xl mx-auto px-4">

        <div class="bg-white shadow-sm p-5 text-center">
            <h1 class="text-xl font-semibold text-gray-800">
                {{.Message}}
            </h1>
        </div>

        <!-- 🔥 BERITA LAINNYA -->
        <div class="mt-10">
            <div class="flex items-center my-10">
                <div class="flex-grow border-t"></div>
                    <div class="flex items-center justify-center gap-2 text-gray-700 font-semibold mt-6">

                        <span>Coba baca ini dulu</span>
                    
                        <!-- SVG setelah kata "dulu" -->
                        <svg xmlns="http://www.w3.org/2000/svg" 
                             class="w-5 h-5 text-gray-500 animate-bounce"
                             fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" 
                                  stroke-linejoin="round" 
                                  stroke-width="2"
                                  d="M17 13l-5 5m0 0l-5-5m5 5V6" />
                        </svg>
                    
                    </div>
                <div class="flex-grow border-t"></div>
            </div>

            <div class="space-y-4">
                {{range .latest}}
                <a href="/berita/{{.Slug}}" 
                   class="flex gap-4 group p-3 rounded-lg hover:bg-gray-50 transition">

                    <img src="{{.Gambar}}" 
                         class="w-24 h-20 object-cover rounded-md">

                    <div>
                        <h3 class="text-base font-semibold text-gray-900">
                            {{.Judul}}
                        </h3>
                        <p class="text-sm text-gray-500">
                            {{excerpt .Isi}}
                        </p>
                    </div>

                </a>
                {{end}}
            </div>
        </div>

    </div>

    {{ template "footer" . }}
