name: Test Feed

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Start server
        run: |
          go run . &
          sleep 10
      
      - name: Test endpoint
        run: |
          curl http://localhost:8080/all-feed
